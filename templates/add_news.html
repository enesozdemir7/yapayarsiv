{% extends "layout.html" %}
{% load crispy_forms_tags %}

{% block body %}


<div class="row">
    <div class="col-md-3">
    </div>
    <div class="col-md-6">
        <h3>Haber Oluştur</h3>
        <hr><br><br>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{form.media}}
            {{form|crispy}}
            <br>
            <button type="submit" class="btn btn-outline-success">Oluştur</button>
<a href="{% url 'forum:manage_news' %}" class="btn btn-outline-secondary">İptal</a>
        </form>
    </div>
    <div class="col-md-3">
    </div>
</div>

{% endblock body %}
