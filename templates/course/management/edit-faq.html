{% extends 'course/management/base.html' %}
{% load static %}

{% block content %}
<div class="container">

    <div class="lg:w-11/12 mx-auto">

        <div class="flex items-center mb-10" >
            <a href="#" onclick="goBack()" class="-ml-2 inline-flex p-1.5 text-xl">
                <ion-icon name="chevron-back-outline"></ion-icon>
            </a>
            <h3 class="font-semibold md:text-xl text-lg">  Geri dön</h3>
            
        </div>

        <div class="bg-white rounded-md shadow">

            <h3 class="px-8 pt-5 mb-2 text-lg font-semibold">  {{ title }}</h3>
            

            <form  method="POST" enctype="multipart/form-data">
                <!-- Basic  -->
                <div class="p-8">
                    <div >
                        {% csrf_token %}

                        <div >
                            <label for="question" class="font-medium self-start"> Soru <span class="text-red-600">*</span></label>
                            <input type="text" class="with-border" name="question" id="question" value="{{ get_faq.question }}" placeholder="Soru">
                            <label for="relpy" class="font-medium self-start"> Cevap <span class="text-red-600">*</span></label>
                            <div class="col-span-2">
                                <textarea class="with-border col-span-2 p-4 min-h-full resize-none" placeholder="Cevap" id="reply" name="reply" type="text" rows="6" value="" required>{{ get_faq.reply }}</textarea>
                            </div>
                        </div>
                        
                        <div class="text-center" style="padding: 10px;">
                            <button type="submit" name="saveCategory" class="button">Kaydet</button>
                       </div>
                          
                    </div>
                </div>


            </form>


        </div>

    </div>

</div>
{% endblock %}
{% block script %}
<script>
    function goBack() {
      window.history.back();
    }
</script>
{% endblock %}
