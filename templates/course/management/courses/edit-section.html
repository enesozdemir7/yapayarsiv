{% extends 'course/management/base.html' %}
{% load static %}

{% block content %}
<div class="container">

    <div class="lg:w-11/12 mx-auto">

        <div class="flex items-center mb-10" >
            <a href="#" onclick="goBack()" class="-ml-2 inline-flex p-1.5 text-xl">
                <ion-icon name="chevron-back-outline"></ion-icon>
            </a>
            <h3 class="font-semibold md:text-xl text-lg">  Geri dön</h3>
            
        </div>

        <div class="bg-white rounded-md shadow">

            <h3 class="px-8 pt-5 mb-2 text-lg font-semibold">  {{ title }}</h3>

            <form  method="POST" enctype="multipart/form-data">
                <!-- Basic  -->
                <div class="p-8">
                    <div >
                        {% csrf_token %}

                        <label for="name" class="font-medium"> Bölüm Adı <span class="text-red-600">*</span></label>
                        <div class="col-span-2">
                            <input type="text" id="name" name="name"  value="{{ get_section.name }}" class="shadow-none with-border" placeholder="Bölüm Adı" required="">
                        </div>
                        
                        <div class="text-center" style="padding: 10px;">
                            <button type="submit" name="editSection" class="button">Kaydet</button>
                       </div>
                          
                    </div>
                </div>


            </form>


        </div>

    </div>

</div>
{% endblock %}
{% block script %}
<script>
    function goBack() {
      window.history.back();
    }
</script>
{% endblock %}
