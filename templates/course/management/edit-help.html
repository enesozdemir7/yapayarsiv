{% extends 'course/management/base.html' %}
{% load static %}

{% block content %}
<div class="container">

    <div class="lg:w-11/12 mx-auto">

        <div class="flex items-center mb-10" >
            <a href="#" onclick="goBack()" class="-ml-2 inline-flex p-1.5 text-xl">
                <ion-icon name="chevron-back-outline"></ion-icon>
            </a>
            <h3 onclick="goBack()" style="cursor: pointer;" class="font-semibold md:text-xl text-lg">  Geri dön</h3>
            
        </div>

        <div class="bg-white rounded-md shadow">

            <h3 class="px-8 pt-5 mb-2 text-lg font-semibold">  {{ title }}</h3>
            

            <form  method="POST" enctype="multipart/form-data">
                <!-- Basic  -->
                <div class="p-8">
                    <div >
                        {% csrf_token %}

                        <label for="title">Başlık*</label>
                        <input type="text" class="with-border col-span-2 p-4" name="title" value="{{ get_help.title }}" id="title" placeholder="Soru Başlığı">
                        <label for="details">Soru Detayları*</label>
                        <div >
                          <textarea class="with-border col-span-2 p-4 min-h-full resize-none" placeholder="Soru Detayları" id="details" name="details" type="text" rows="4" required>{{ get_help.details }}</textarea>
                          <p class="mt-2 text-sm text-gray-500"> Soru detayını kısa ve açıklayıcı yazınız.</p>
                      </div>
                        
                        <div class="text-center" style="padding: 10px;">
                            <button type="submit" name="editHelp" class="button">Kaydet</button>
                       </div>
                          
                    </div>
                </div>


            </form>


        </div>

    </div>

</div>
{% endblock %}
{% block script %}
<script>
    function goBack() {
      window.history.back();
    }
</script>

<script src="{% static 'course/assets/js/aksfileupload.js' %}"></script>
<script>
    $(function () {
        $("aks-file-upload").aksFileUpload({
            fileUpload: "#uploadfile",
            dragDrop: true,
            maxSize: "1 MB",
            multiple: false,
            maxFile: 1
        });
    });
</script>
{% endblock %}
