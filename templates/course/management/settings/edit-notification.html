{% extends 'course/management/base.html' %}
{% load static %}

{% block content %}
<div class="container">

    <div class="lg:w-11/12 mx-auto">

        <div class="flex items-center mb-10" >
            <a href="#" onclick="goBack()" class="-ml-2 inline-flex p-1.5 text-xl">
                <ion-icon name="chevron-back-outline"></ion-icon>
            </a>
            <h3 class="font-semibold md:text-xl text-lg">  Geri dön</h3>
            
        </div>

        <div class="bg-white rounded-md shadow">

            <h3 class="px-8 pt-5 mb-2 text-lg font-semibold">  {{ title }}</h3>
            

            <form  method="POST" enctype="multipart/form-data">
                <!-- Basic  -->
                <div class="p-8">
                    <div >
                        {% csrf_token %}

                        <div class="col-span-2">
                        <label for="title" class="font-medium self-start"> Bildirim Başlığı <span class="text-red-600">*</span></label>
                        <input type="text" class="with-border" value="{{ get_n.title }}" name="title" id="title" placeholder="Bildirim Başlığı">
                        <label for="link" class="font-medium self-start"> Bildirim Link <span >(Zorunlu değil)</span></label>
                        <input type="text" class="with-border" name="link" value="{{ get_n.link }}" id="link" placeholder="Bildirim Link">

                        </div>
                        
                        <div class="text-center" style="padding: 10px;">
                            <button type="submit" name="editNotification" class="button">Kaydet</button>
                       </div>
                          
                    </div>
                </div>


            </form>


        </div>

    </div>

</div>
{% endblock %}
{% block script %}
<script>
    function goBack() {
      window.history.back();
    }
</script>

<script src="{% static 'course/assets/js/aksfileupload.js' %}"></script>
<script>
    $(function () {
        $("aks-file-upload").aksFileUpload({
            fileUpload: "#uploadfile",
            dragDrop: true,
            maxSize: "1 MB",
            multiple: false,
            maxFile: 1
        });
    });
</script>
{% endblock %}
