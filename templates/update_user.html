
{% extends "layout.html" %}
{% load crispy_forms_tags %}

{% block body %}


<div class="row">
    <div class="col-md-6 offset-md-3">
        <h3>Kullanıcı Hesabını Güncelle</h3>
        <hr><br><br>
    </div>
    <div class="col-md-4 offset-md-4">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{form.media}}
            {{form|crispy}}
            <br>
            <button type="submit" class="btn btn-success">Güncelle</button>
            <a href="{% url 'user:manage_users' %}" class="btn btn-secondary">İptal</a>
        </form>
    </div>
</div>
<br><br><br><hr><br>


{% endblock body %}
